<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Bobby Pro Landscapes home">
        <img src="{{ '/assets/logo.svg' | relative_url }}" alt="Bobby Pro Landscapes logo">
        <span>Bobby Pro Landscapes</span>
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
        <span class="sr-only">Open menu</span>
        <span></span><span></span><span></span>
      </button>

      <nav id="site-menu" class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/services/' | relative_url }}">Services</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a class="nav-cta" href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <strong>Bobby Pro Landscapes</strong>
        <p>Creating practical, attractive outdoor spaces.</p>
      </div>
      <div>
        <strong>Garden & outdoor services</strong>
        <p>Landscaping • Paving • Fencing • Lawns • Garden buildings</p>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>&copy; {{ 'now' | date: "%Y" }} Bobby Pro Landscapes. All rights reserved.</span>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
